    <div class="content">
        <p>「MOEMDM大平臺」是教育部為協助學校更有效管理平板載具，特別委託系統廠商所開發的統一管理平台。系統每晚自動從這些原生MDM抓取「上線時間」、「使用時間」等資料，並於隔日上午10點更新於平台報表中，協助教師掌握載具的實際使用情況。</p>
        <a href="https://mdm.edu.tw/"><img src="images/MDM_website.png" alt="教育部學習載具系統" class="MDM_website" /></a>

        </div>
        <div class="imageLeft_textRight">
